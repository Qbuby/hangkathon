# 杭客松 · 宝塔 nginx 站点配置（安全评估 P1/P2 加固 + 公共反代头抽取后的形态）
#
# 这份文件是 /etc 下配置的**源码**：改动请改这里并部署，服务器上的副本由
# deploy/deploy-nginx.sh 同步（记忆里的教训：直接在服务器上手改配置，
# 没有版本记录、且容易改坏——这次就坏过一次）。
#
# 要点：
#   1. X-Forwarded-For 覆盖式透传（$remote_addr），不是 $proxy_add_x_forwarded_for。
#      追加模式下客户端可自报任意 XFF，会污染审计日志的可溯源 IP，并让按 IP 的
#      应用层限流被逐请求换 IP 绕过。四个 proxy_set_header 已抽到
#      nginx-proxy-common.inc，三个 location 共用一份定义。
#   2. 双层限流：nginx 先挡（按真实客户端 IP），应用层再挡。429 统一带 Retry-After。
#   3. 非 GET 的 /api/ 写接口单独限速；GET 读接口不限（页面加载会连发多个 GET）。
#      limit_req 不能写在 limit_except 里，用 map 把 GET 的 key 置空来实现（空 key 不计数）。

# 限流：按真实客户端 IP
map $request_method $api_write_key {
    GET     "";
    default $binary_remote_addr;
}
limit_req_zone $api_write_key    zone=api_write:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_auth:1m rate=10r/m;

server {
    listen 80;
    server_name hangkathon.com www.hangkathon.com;
    access_log /www/wwwlogs/hangkathon.com.log;
    return 301 https://hangkathon.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hangkathon.com www.hangkathon.com;
    access_log /www/wwwlogs/hangkathon.com.log;
    client_max_body_size 20m;
    ssl_certificate /www/server/nginx/cert/hangkathon/fullchain.pem;
    ssl_certificate_key /www/server/nginx/cert/hangkathon/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 登录入口：最严格
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:3210;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/hangkathon-proxy-common.inc;
    }

    # 其余接口：仅非 GET 限速
    location /api/ {
        limit_req zone=api_write burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:3210;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/hangkathon-proxy-common.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_cache off;
        include /www/server/panel/vhost/nginx/hangkathon-proxy-common.inc;
    }

    # 限流触发的统一响应：JSON + Retry-After（对抗套件 D 组断言这一条）
    location @rate_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        return 429 '{"error":"请求过于频繁，请稍后再试"}';
    }
}
