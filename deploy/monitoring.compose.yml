# 监控与告警栈（Uptime Kuma + Healthchecks）
#
# 为什么是这两件：
#   - Uptime Kuma 自建，探测站点/接口/容器的存活，自己宕机时没人知道；
#   - Healthchecks.io 免费层托管在**服务器之外**，做备份/自检任务的「死人开关」——
#     整台机器宕机时它仍能告警，这是自建方案做不到的（故障域不同）。
#
# 关键约束：云防火墙只放行 80/443（22 已按安全评估关闭），所以 Uptime Kuma
# 绑定 127.0.0.1:3001，经 nginx 反代到 uptime.hangkathon.com + Basic Auth，
# 不新增任何公网端口。
#
# 部署：sh deploy/monitoring-setup.sh（幂等，可重复执行）

services:
  uptime-kuma:
    # 带 docker.m.daocloud.io 前缀：这台机器直连 Docker Hub 很慢（裸 louislam/uptime-kuma
    # 拉了 8 分钟卡在解包），显式走国内镜像前缀几分钟完成。内容与上游同一份 digest。
    image: docker.m.daocloud.io/louislam/uptime-kuma:1
    container_name: hangkathon-uptime
    restart: unless-stopped
    # OOM 优先级：监控是「出事时唯一还活着的人」，不能被部署的构建挤死。
    # 2026-10-24 事故：一次部署的构建峰值把运行中的 uptime node 杀了，
    # 监控自己重启 = 告警断线，且重启期间谁都收不到 Down/Up 通知。
    oom_score_adj: -900
    # 仅环回可达：公网入口只有 nginx 反代的子域名
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      # 只读挂 docker socket：Kuma 需要它才能用「Docker」类型监控项列出容器。
      # 默认不加是更安全的姿态（拿到 socket ≈ 拿到宿主机 root），这里按需开启且限制为只读。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # 用国内可达的镜像源拉取 npm 依赖（容器启动时会自更新）
      UPTIME_KUMA_UPDATE_CHECK: "true"
    # 与应用同网：容器监控需要，能对 127.0.0.1:3210 做内网探测
    networks:
      - hangkathon_default
    # 用应用的网络而不是自动生成的 deploy_default —— 网络共享是 Compose 自动命名的，
    # 独立文件跑会得到另一个网络，容器之间就互相不可见。
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

volumes:
  uptime-kuma-data:
    name: hangkathon-uptime-data

networks:
  hangkathon_default:
    name: hangkathon_default
    external: true
