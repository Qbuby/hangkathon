# Uptime Kuma 管理界面：仅经 nginx 反代可达，入口有 Basic Auth。
# 容器本身绑定 127.0.0.1:3001，云防火墙不放行 3001 —— 不新增任何公网端口。
#
# 密码生成：openssl passwd -apr1 '<你的口令>'，把结果填进 /etc/nginx/conf.d/kuma.htpasswd
#          的 `monitor:<hash>` 一行（文件权限 640，属主 root:nginx）。

server {
    listen 80;
    server_name uptime.hangkathon.com;
    return 301 https://uptime.hangkathon.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name uptime.hangkathon.com;
    access_log /www/wwwlogs/uptime.hangkathon.com.log;

    ssl_certificate /www/server/nginx/cert/uptime.hangkathon.com/fullchain.pem;
    ssl_certificate_key /www/server/nginx/cert/uptime.hangkathon.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 监控面板不要被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Basic Auth
    auth_basic "Hangkathon Monitoring";
    auth_basic_user_file /etc/nginx/conf.d/kuma.htpasswd;

    # Kuma 依赖 websocket 推送状态，代理读超时放宽
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}