# 杭客松自托管部署：独立于 Vercel 的那一份，走 IP + 非标端口，带自己的 Postgres。
# 用法：docker compose up -d --build
services:
  postgres:
    image: postgres:18-alpine
    container_name: hangkathon-postgres
    restart: unless-stopped
    # 只在 compose 内网可达，不发布端口（宿主机的 5432 是宝塔那台，互不干扰）
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hangkathon}
      POSTGRES_USER: ${POSTGRES_USER:-hangkathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # postgres:18 起数据目录改成带版本号的子目录，挂载点必须是 /var/lib/postgresql；
      # 挂到 /var/lib/postgresql/data 会被镜像判定成旧版布局并拒绝启动。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hangkathon} -d ${POSTGRES_DB:-hangkathon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      # 统一 90 天留存口径：容器日志交给 journald，与 nginx/systemd 同一条留存策略
      # （/etc/systemd/journald.conf.d/hangkathon.conf 的 MaxRetentionSec=90day）。
      # 换驱动后 `docker logs` 不再可用，改用 `journalctl CONTAINER_NAME=<名字> --since -24h`。
      driver: journald

  hangkathon:
    build:
      context: .
      dockerfile: Dockerfile
    image: hangkathon:local
    container_name: hangkathon
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # 只映射到宿主机的非标端口，不动这台机器上已有的 80 / 888 / 21077（宝塔、nginx、面板）
    ports:
      # 只绑在环回地址：对公网唯一入口是宝塔 nginx（443/80 → 127.0.0.1:3210），
      # 这样云防火墙只放行 80/443 即可，应用端口本身不再暴露在公网。
      - "127.0.0.1:3210:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-hangkathon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hangkathon}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      # 同上：应用容器日志并入 journald，统一 90 天
      driver: journald

volumes:
  pgdata:
