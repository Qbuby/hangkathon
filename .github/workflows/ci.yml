name: CI

# 合并前闸门：跑在 GitHub 的干净 runner 上，与本地 scripts/ci/gates.mjs 同一套命令。
# 部署后冒烟与对抗测试不打这里 —— 它们在服务器的 deploy/ci.sh 里跑（GitHub runner 访问不到内网容器）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支只保留最新一次，避免连续推送时排队堆积
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本 workflow 不需要任何写操作（ci-cd-security：GITHUB_TOKEN 收紧到只读）
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # SHA 固定（ci-cd-security：浮动 tag 可被上游接管）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      # 服务器在国内直连 npmjs 不稳定，runner 在境外但依赖里有 next/eslint 等大包，
      # 统一走 npmmirror 让本地与 CI 解析出同一份依赖树。
      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: node --test scripts/*.test.mjs scripts/douyin/*.test.mjs

      # 两个构建目标都要过：代码同一份，Vercel 走 localStorage、自托管走 Postgres，
      # 只验证其中一个，另一个的破坏会在部署时才暴露。
      - name: 构建（自托管）
        run: npm run build:vercel

      - name: 构建（Vercel）
        run: npm run build:vercel

      # 已知漏洞闸门：high/critical 直接失败（与 npm audit fix 的修复线联动）
      - name: 依赖漏洞审计
        run: npm audit --omit=dev --audit-level=high

      # 部署产物里绝不能出现凭据：用模式扫描而不是人工检查
      - name: 检查产物中是否泄漏凭据
        run: |
          set -e
          if grep -rIl -E 'LTAI5t[A-Za-z0-9]{8,}|wx[0-9a-f]{16}|(SECRET|AppSecret)[\"'"'"']?\s*[:=]\s*[\"'"'"'][A-Za-z0-9_\-]{16,}' .next public 2>/dev/null; then
            echo "::error::构建产物中发现疑似凭据，请立即轮换并清除"
            exit 1
          fi
          echo "未发现凭据泄漏"
